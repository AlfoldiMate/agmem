[package]
name = "agmem-server"
description = "agmem: agent memory over MCP. The `agmem` binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "agmem"
path = "src/main.rs"

[dependencies]
# `schema` puts core's enums, and their variant docs, into the tool schemas
# agents read.
agmem-core = { workspace = true, features = ["schema"] }
agmem-store = { workspace = true }
agmem-embed = { workspace = true }
# io-util carries tokio::io::duplex, which the in-process protocol tests
# stand the client and the server up on; net/io-std/sync/time are the shared
# daemon (issue #37) — a unix socket, the stdio it pumps into, the channel
# counting attached sessions, and the idle timeout.
tokio = { workspace = true, features = ["io-util", "io-std", "net", "sync", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
directories = { workspace = true }
jiff = { workspace = true }
# `client` is not only for tests: `agmem context` (issue #46) speaks MCP to
# the shared daemon from the client side, over the same socket a session uses.
rmcp = { workspace = true, features = ["client"] }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
