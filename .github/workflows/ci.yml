name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Embed tests that need a real model are #[ignore]d / feature-gated;
  # CI must never download ONNX models (design §7, issue #2).
  FASTEMBED_CACHE_DIR: /nonexistent

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The BM25-only build must keep compiling: no ONNX Runtime, no model.
      - run: cargo check --workspace --no-default-features --all-targets
