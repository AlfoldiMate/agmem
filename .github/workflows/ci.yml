name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Embed tests that need a real model are #[ignore]d / feature-gated;
  # CI must never download ONNX models (design §7, issue #2).
  FASTEMBED_CACHE_DIR: /nonexistent

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # tests/ws.rs drives a real SurrealDB server; without the binary those
      # tests skip silently, so CI installs it to keep sharing mode honest.
      # Pinned direct download: the install.surrealdb.com script double-shifts
      # its positional argument, which is fatal under dash on ubuntu.
      - name: Install SurrealDB
        run: |
          case "$RUNNER_OS" in
            Linux) asset=surreal-v3.2.3.linux-amd64.tgz ;;
            macOS) asset=surreal-v3.2.3.darwin-arm64.tgz ;;
          esac
          mkdir -p "$HOME/.surrealdb"
          curl -sSfL "https://download.surrealdb.com/v3.2.3/$asset" | tar -xz -C "$HOME/.surrealdb"
          echo "$HOME/.surrealdb" >> "$GITHUB_PATH"
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The BM25-only build must keep compiling: no ONNX Runtime, no model.
      - run: cargo check --workspace --no-default-features --all-targets
