[package]
name = "agmem-embed"
description = "agmem embedding backends: fastembed/ONNX, and a no-op for BM25-only mode."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["onnx"]
# The fastembed/ONNX backend. Off in BM25-only builds, which then need no
# ONNX Runtime binaries at all.
onnx = ["dep:fastembed"]

[dependencies]
fastembed = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
