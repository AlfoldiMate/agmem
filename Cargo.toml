[workspace]
resolver = "3"
members = [
    "crates/agmem-core",
    "crates/agmem-store",
    "crates/agmem-embed",
    "crates/agmem-server",
]

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AlfoldiMate/agmem"
homepage = "https://github.com/AlfoldiMate/agmem"

[workspace.dependencies]
# The `version` beside each `path` is for `cargo package`, which release-plz
# runs to compare a crate against its last release: packaging refuses a path
# dependency with no version requirement. Local builds resolve by path either
# way, and a caret requirement stays satisfied across the bumps release-plz
# makes.
agmem-core = { path = "crates/agmem-core", version = "0.1.5" }
agmem-store = { path = "crates/agmem-store", version = "0.1.5" }
# default-features off so a BM25-only build can drop the ONNX half entirely
agmem-embed = { path = "crates/agmem-embed", version = "0.1.5", default-features = false }

# MCP + storage + embeddings (pinned per docs/design.md §4.1)
rmcp = { version = "3.1", features = ["server", "macros", "transport-io"] }
surrealdb = { version = "3.2", default-features = false, features = [
    "kv-surrealkv",
    "kv-mem",
    "protocol-ws",
] }
# Exact pin: fastembed in turn pins ort "=2.0.0-rc.13", so this one line fixes
# the ONNX Runtime too (design risk #1 — ort is still a release candidate).
# default-features off drops `image-models`, which we never call.
fastembed = { version = "=6.0.2", default-features = false, features = [
    "ort-download-binaries-native-tls",
    "hf-hub-native-tls",
] }
# The pure-Rust contingency (design risk #1): potion-base-8M static
# embeddings, no ONNX. default-features off swaps tokenizers'' onig (a C
# library) for fancy-regex, keeping the no-C-deps point of the backend.
model2vec-rs = { version = "0.2.1", default-features = false, features = [
    "hf-hub",
    "fancy-regex",
] }

tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.2"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6.0"
jiff = { version = "0.2", features = ["serde"] }
blake3 = "1.8"

insta = { version = "1", features = ["json"] }
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# stdout is the MCP wire; anything written there corrupts the protocol
print_stdout = "deny"
dbg_macro = "deny"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = true
