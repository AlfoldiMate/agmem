[package]
name = "agmem-server"
description = "agmem: agent memory over MCP. The `agmem` binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "agmem"
path = "src/main.rs"

[features]
default = ["onnx"]
# The local ONNX embedder. Without it the binary still runs, BM25-only, and
# needs no ONNX Runtime at build time.
onnx = ["agmem-embed/onnx"]

[dependencies]
agmem-core = { workspace = true }
agmem-store = { workspace = true }
agmem-embed = { workspace = true }
# io-util carries tokio::io::duplex, which the in-process protocol tests
# stand the client and the server up on.
tokio = { workspace = true, features = ["io-util"] }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
directories = { workspace = true }
rmcp.workspace = true

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
# The protocol tests drive the server with a real rmcp client, in-process.
rmcp = { workspace = true, features = ["client"] }

[lints]
workspace = true
