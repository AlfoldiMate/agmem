# Config for `dist` (cargo-dist) — https://axodotdev.github.io/cargo-dist
[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "AlfoldiMate/homebrew-tap"
# Customize the Homebrew formula name
formula = "agmem"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
# Whether to install an updater program
install-updater = false
# Whether to enable GitHub Attestations
github-attestations = true
# Path that installers should place binaries in
install-path = "CARGO_HOME"

# llama.cpp is built from source inside the cargo build (llama-cpp-2 vendors
# it), so every build host needs cmake and a C++ compiler. The GitHub images
# carry both; the lines below make it explicit for the installers' sake.
[dist.dependencies.apt]
cmake = { version = "*", stage = ["build"] }

[dist.dependencies.homebrew]
cmake = { version = "*", stage = ["build"] }

[dist.github-custom-runners]
# Native arm runner: llama.cpp's NEON paths want a real aarch64 host, and
# cross-compiling a C++ tree from x86 is a second toolchain to keep alive.
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
# 24.04 rather than the 22.04 default: a recent cmake and compiler for the
# vendored llama.cpp.
x86_64-unknown-linux-gnu = "ubuntu-24.04"
